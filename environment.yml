# Ambiente usado em todas as execucoes do paper (conda env "ilumpy", cluster CNPEM).
# Versoes lidas dos logs/notebooks executados. Recriar com:  conda env create -f environment.yml
name: wvc2026-texture-vs-learned
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.13.2
  - pip
  - pip:
      - torch==2.10.0          # build cu128 (CUDA 12.8); driver NVIDIA 610.43.02
      - torchvision==0.25.0
      - transformers==4.49.0   # owkin/phikon (v1) via huggingface-hub
      - huggingface-hub==0.34.4
      - timm==1.0.26
      - scikit-learn==1.7.2
      - scikit-image==0.26.0
      - numpy==2.3.3
      - scipy==1.16.2
      - pandas==2.3.3
      - pillow==11.3.0
      - matplotlib==3.10.6
      - tifffile==2026.7.14
      - joblib==1.5.2
      - tabulate
      - nbconvert
